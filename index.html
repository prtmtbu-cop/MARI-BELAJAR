<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edu Video Hub</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    margin: 0;
}

header {
    background: #1e293b;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.03);
}

iframe {
    width: 100%;
    height: 200px;
    border: none;
}

.title {
    padding: 10px;
    font-size: 14px;
}
</style>
</head>

<body>

<header>📚 Edu Video Hub</header>

<div class="container">

<!-- VIDEO 1 -->
<div class="card">
<iframe src="https://drive.google.com/file/d/1clYmhw9jjuMVfxGf8VpzjUVhm6pj3Z--/preview"></iframe>
<div class="title">Materi 1 - PMR </div>
</div>

<!-- VIDEO 2 -->
<div class="card">
<iframe src="https://drive.google.com/file/d/FILE_ID_2/preview"></iframe>
<div class="title">Materi 2 - Lanjutan</div>
</div>

</div>

</body>
</html>
