<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>EduFlix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
    }

    header {
      background: black;
      padding: 15px 30px;
      font-size: 24px;
      font-weight: bold;
      color: red;
    }

    .container {
      padding: 20px;
    }

    #search {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #222;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .thumbnail {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .title {
      padding: 10px;
      font-size: 14px;
    }

    /* MODAL VIDEO */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }

    .modal iframe {
      width: 80%;
      height: 80%;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>EduFlix 🎬</header>

<div class="container">
  <input type="text" id="search" placeholder="Cari video...">

  <div class="grid" id="videoList"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <span class="close" onclick="closeVideo()">✖</span>
  <iframe id="player" src="" allowfullscreen></iframe>
</div>

<script>
const sheetURL = "https://opensheet.elk.sh/1-hNVcwcrBo8WQnhhOneTSph6cBIynRrOgPMxPapVSjc/DATA%20VIDEO";

const videoList = document.getElementById('videoList');
const searchInput = document.getElementById('search');

async function getVideos() {
  try {
    const res = await fetch(sheetURL);
    const data = await res.json();

    console.log("DATA:", data);

    displayVideos(data);

    searchInput.addEventListener('input', function() {
      const keyword = this.value.toLowerCase();
      const filtered = data.filter(v =>
        (v.title || "").toLowerCase().includes(keyword)
      );
      displayVideos(filtered);
    });

  } catch (err) {
    console.error("ERROR:", err);
    videoList.innerHTML = "<h2>Gagal load data</h2>";
  }
}

function displayVideos(list) {
  videoList.innerHTML = '';

  if (!list || list.length === 0) {
    videoList.innerHTML = "<h2>Data kosong</h2>";
    return;
  }

  list.forEach(video => {
    const title = video.title || "No Title";
    const thumbnail = video.thumbnail || "";
    const link = video.link || "";

    videoList.innerHTML += `
      <div class="card" onclick="playVideo('${link}')">
        <img class="thumbnail" src="${thumbnail}" 
        onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'">
        <div class="title">${title}</div>
      </div>
    `;
  });
}

function playVideo(link) {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('player').src = link;
}

function closeVideo() {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('player').src = '';
}

document.addEventListener("DOMContentLoaded", getVideos);
</script>

</body>
</html>
