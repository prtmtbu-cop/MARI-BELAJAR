<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTfm4L7y-Kx7NREfMw9T-MprqGUlhN2fWYYf6FSAhCHAcC0w_Z7C1PwzTtSNJeue5NXmrjz60KMPUfo/pub?output=csv";

const videoList = document.getElementById('videoList');

// PARSE CSV LEBIH AMAN
function parseCSV(text) {
  const rows = text.trim().split("\n");
  const data = rows.slice(1).map(row => {
    const cols = row.split(/,(?=(?:(?:[^\"]*\"){2})*[^\"]*$)/);
    return {
      title: cols[0],
      thumbnail: cols[1],
      link: cols[2]
    };
  });
  return data;
}

// AMBIL DATA
async function getVideos() {
  const res = await fetch(sheetURL);
  const text = await res.text();
  const videos = parseCSV(text);

  displayVideos(videos);

  // SEARCH
  document.getElementById('search').addEventListener('input', function() {
    const keyword = this.value.toLowerCase();
    const filtered = videos.filter(v =>
      v.title.toLowerCase().includes(keyword)
    );
    displayVideos(filtered);
  });
}

// TAMPILKAN VIDEO
function displayVideos(list) {
  videoList.innerHTML = '';

  list.forEach(video => {
    if (!video.link) return;

    videoList.innerHTML += `
      <div class="card" onclick="playVideo('${video.link}')">
        <img class="thumbnail" src="${video.thumbnail}" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'">
        <div class="title">${video.title}</div>
      </div>
    `;
  });
}

// PLAY VIDEO
function playVideo(link) {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('player').src = link;
}

// CLOSE VIDEO
function closeVideo() {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('player').src = '';
}

// LOAD
getVideos();
</script>
